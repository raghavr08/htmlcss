<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript & AI Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HOME SECTION -->
    <div class="container">
        <h1>My JavaScript Project</h1>

        <p>Welcome to my interactive webpage!</p>

        <button id="themeButton" type="button">
            Dark Mode
        </button>

        <br><br>

        <a href="#quiz" class="quiz-link">
            Take the Quiz
        </a>
    </div>

    <!-- QUIZ SECTION -->
    <div class="quiz-container" id="quiz">

        <h1>JavaScript & AI Quiz</h1>

        <p id="question-number">Question 1 of 5</p>

        <h2 id="question">Question will appear here</h2>

        <div id="answers"></div>

        <p id="score">Score: 0</p>

        <p id="message"></p>

        <a href="#" class="back-button">
            Back to Top
        </a>

    </div>

    <script src="script.js"></script>

</body>
</html>
